Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowMouseOpenFail" "true"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "CloudDummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "CloudMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1280x900" 96.00 1280 1360 1496 1712 900 903 913 934
EndSection
Section "Screen"
    Identifier "CloudScreen"
    Device "CloudDummy"
    Monitor "CloudMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x900"
        Virtual 1280 900
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "CloudLayout"
    Screen "CloudScreen"
EndSection
